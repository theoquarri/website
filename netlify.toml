# Netlify configuration.
#
# The reason this file exists: Netlify's default is
# `Cache-Control: public, max-age=0, must-revalidate` on EVERYTHING, including
# stylesheets, scripts, logos and photographs. That means every navigation
# revalidates every asset against the server. Even a 304 costs a round trip, and
# with 25-plus assets a page it is the whole "slow between pages" feeling.
#
# HTML deliberately keeps must-revalidate. A deploy must be visible immediately;
# it is the cheap request and it is the one that must never be stale.

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Stylesheets are versioned by _bump_assets.py (styles.css?v=93), so a change
# produces a new URL and a year is safe. immutable additionally stops the
# browser revalidating on a manual reload.
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Scripts are versioned the same way, but this path also carries the logo,
# favicons, the OG image and the video, which are NOT versioned. Thirty days
# removes the per-navigation revalidation without making a replaced logo
# invisible for a year. Raise it once assets are content-hashed.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Same reasoning. Filenames are stable but not content-addressed, so a photo
# swapped under the same name should not be stuck for a year.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Small and change every publish, so they revalidate.
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The guides for AI agents (agents.md, agents-reference.md). Markdown is read as text by
# agents and browsers; say so, with the charset, and revalidate like llms.txt.
[[headers]]
  for = "/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

# ChatGPT plugin domain verification (19 Oct 2026): OpenAI reads the token as plain text.
[[headers]]
  for = "/.well-known/openai-apps-challenge"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# Connect QuickBooks pages (connect/quickbooks/, Theo 21 Oct 2026): the done page's address carries a
# one-time QuickBooks authorization code, so these pages send no Referer, cannot be framed, run only
# their own script file, and the done page is never cached.
[[headers]]
  for = "/connect/*"
  [headers.values]
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'"

[[headers]]
  for = "/connect/quickbooks/done/*"
  [headers.values]
    Cache-Control = "no-store"
